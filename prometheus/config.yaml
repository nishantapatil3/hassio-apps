# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Prometheus
version: "1.0.1"
slug: prometheus
description: >-
  Prometheus monitoring and time-series database for Home Assistant.
url: https://github.com/nishantapatil3/hassio-apps/tree/main/prometheus
arch:
  - aarch64
  - amd64
init: false
backup: cold
ports:
  9090/tcp: 9090
ports_description:
  9090/tcp: Prometheus web UI and API
webui: http://[HOST]:[PORT:9090]
options:
  scrape_interval: "15s"
  evaluation_interval: "15s"
  retention_time: "15d"
  scrape_litellm: true
  litellm_target: db21ed7f-litellm:4000
  scrape_homeassistant: false
  homeassistant_target: homeassistant.local:8123
  homeassistant_token: ""
schema:
  scrape_interval: str
  evaluation_interval: str
  retention_time: str
  scrape_litellm: bool
  litellm_target: str
  scrape_homeassistant: bool
  homeassistant_target: str
  homeassistant_token: password
image: ghcr.io/nishantapatil3/hassio-apps-prometheus
