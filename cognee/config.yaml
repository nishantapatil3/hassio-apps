# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Cognee
version: "1.0.0"
slug: cognee
description: >-
  Self-hosted AI memory and knowledge graph API for agents.
url: https://github.com/nishantapatil3/hassio-apps/tree/main/cognee
arch:
  - aarch64
  - amd64
init: false
backup: cold
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Cognee API and interactive API documentation
webui: http://[HOST]:[PORT:8000]/docs
map:
  - type: addon_config
    read_only: false
    path: /data
options:
  llm_api_key: ""
  llm_provider: openai
  llm_model: openai/gpt-5-mini
  llm_endpoint: ""
  embedding_api_key: ""
  embedding_provider: openai
  embedding_model: openai/text-embedding-3-large
  embedding_endpoint: ""
  embedding_dimensions: 3072
  cors_allowed_origins: "*"
  log_level: INFO
schema:
  llm_api_key: password
  llm_provider: str
  llm_model: str
  llm_endpoint: str
  embedding_api_key: password
  embedding_provider: str
  embedding_model: str
  embedding_endpoint: str
  embedding_dimensions: int
  cors_allowed_origins: str
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
image: ghcr.io/nishantapatil3/hassio-apps-cognee
